<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真部の写真館</title>
<meta name="description" content="第58回流高祭 写真部の写真館 Photo Studio by the Photography Club 特設サイト（準備中）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Yuji+Boku&display=swap">
<style>
/* 構成：ポスターと同じ「月夜×紅葉」。全画面の夜空に月・遠景・枝を置き、SVGのモミジを降らせ、下部に告知。 */
:root{
  --night:#0E122A;      /* ポスター地色 */
  --night-2:#1b1840;
  --dusk:#3a2a5c;       /* 地平線の紫 */
  --silhouette:#120f26;
  --gold:#DEB86E;
  --cream:#F6EEDE;
  --vermilion:#C43026;
  --moon:#F3E6B2;
  --f-display:'Yuji Boku','Hina Mincho','Yu Mincho','Hiragino Mincho ProN',serif;
  --f-body:'Hina Mincho','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--f-body);overflow:hidden}

.stage{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,var(--night) 0%,var(--night) 38%,var(--night-2) 72%,var(--dusk) 100%)}
.stage>*{position:absolute}

/* 星 */
.stars{inset:0;width:100%;height:100%}
.stars circle{fill:var(--cream)}
.stars .tw{animation:twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes twinkle{from{opacity:.95}to{opacity:.15}}

/* 月 */
.moon{left:max(8%,24px);top:9%;width:clamp(84px,17vmin,190px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 42% 38%,#fbf2cf 0%,var(--moon) 55%,#e6d39a 100%);
  box-shadow:0 0 2px 1px rgba(255,244,200,.6),0 0 40px 10px rgba(243,230,178,.28),0 0 140px 50px rgba(243,230,178,.12)}

/* 遠景 */
.haze{left:0;right:0;bottom:0;height:45%;background:radial-gradient(120% 70% at 50% 100%,rgba(120,80,160,.32),transparent 70%)}
.hills{left:0;bottom:0;width:100%;height:24vh}
.hills .far{fill:#2a2350}
.hills .mid{fill:#1c1838}
.hills .near{fill:var(--silhouette)}
.pagoda{right:9%;bottom:calc(24vh * .34);height:clamp(130px,30vh,310px);width:auto;fill:var(--silhouette)}
.trees{left:-2%;bottom:calc(24vh * .5);width:clamp(150px,22vw,320px);height:auto;fill:var(--silhouette)}

/* 枝（右上） */
.branch{top:-2%;right:-3%;width:clamp(260px,46vw,640px);height:auto;transform-origin:100% 8%;will-change:transform;
  filter:drop-shadow(0 0 12px rgba(255,170,90,.28))}
.branch .bl{transform-box:view-box;animation:flutter 3s ease-in-out infinite alternate}
@keyframes flutter{from{transform:rotate(calc(var(--a) * -1))}to{transform:rotate(var(--a))}}

/* 降るモミジ */
.fall{inset:0;pointer-events:none}
.leaf{position:absolute;left:0;top:0;will-change:transform,opacity}
.leaf svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px rgba(255,170,90,.32))}
.leaf svg.far{filter:brightness(.72) saturate(.85) blur(.5px)}
.leaf svg.bokeh{filter:blur(3.5px) brightness(1.05)}

/* 文字レイヤー：中央にタイトル、下部に開催情報 */
.page{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(clamp(20px,5.5vh,60px) + env(safe-area-inset-bottom,0px));
  text-shadow:0 2px 4px rgba(0,0,8,.85)}
.page p,.page h1{margin:0}
.rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--dl,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* タイトル（ポスターと同じ組み） */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;--c:clamp(84px,19vmin,200px);padding-top:4vh}
.kicker{font-size:calc(var(--c) * .22);letter-spacing:.3em;padding-left:.3em;line-height:1.2;color:var(--gold)}
.studio{display:flex;align-items:flex-start;gap:calc(var(--c) * .03);margin-top:4px!important;font-family:var(--f-display);font-weight:400;line-height:1;color:var(--cream);
  text-shadow:3px 4px 4px rgba(0,0,8,.75),0 0 32px rgba(220,160,80,.4)}
.studio span:nth-child(1){font-size:var(--c)}
.studio span:nth-child(2){font-size:calc(var(--c) * .86);margin-top:calc(var(--c) * .185)}
.studio span:nth-child(3){font-size:calc(var(--c) * 1.03);margin-top:calc(var(--c) * -.02)}
.en{display:flex;align-items:center;gap:14px;margin-top:calc(var(--c) * .09)!important;color:var(--gold);
  font-size:clamp(11px,2vmin,18px);letter-spacing:.17em;padding-left:.17em;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,8,.8)}
.en .ln{width:clamp(14px,4vw,36px);height:1px;background:var(--gold);opacity:.8;flex:none}

/* 開催情報 */
.info{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px)}
.edition{display:flex;align-items:center;gap:12px;color:var(--cream);font-size:clamp(18px,3vmin,26px);letter-spacing:.24em;line-height:1.3}
.edition b{font-weight:400;padding-left:.24em;white-space:nowrap}
.rule{width:clamp(28px,7vw,90px);height:1px;background:var(--gold)}
.dia{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}

.date{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:14px;font-size:clamp(24px,4.4vmin,42px);line-height:1.2}
.date .box{display:inline-flex;align-items:center;justify-content:center;padding:.1em .45em .1em .57em;border:4px double var(--gold);
  color:var(--gold);font-size:.6em;letter-spacing:.12em}
.date .md{font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(0,0,8,.85),0 0 14px rgba(255,210,160,.3)}

.divider{display:flex;align-items:center;gap:12px;width:min(520px,82vw)}
.divider .ln{flex:1;height:1px;background:var(--gold);opacity:.75}
.divider .kn{width:12px;height:12px;box-sizing:border-box;border:1.5px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center}
.divider .kn::after{content:"";width:5px;height:5px;background:var(--vermilion)}

.prep{font-size:clamp(16px,2.5vmin,23px);letter-spacing:.3em;padding-left:.3em;color:var(--cream)}
.prep i{font-style:normal;animation:dot 1.8s ease-in-out infinite}
.prep i:nth-child(2){animation-delay:.3s}
.prep i:nth-child(3){animation-delay:.6s}
@keyframes dot{0%,100%{opacity:.25}40%{opacity:1}}

/* 外部リンク案内 */
.fes-link{display:inline-flex;align-items:center;gap:10px;margin-top:clamp(4px,1vh,10px);padding:.55em 1.2em .55em 1.35em;
  border:1px solid rgba(222,184,110,.7);background:rgba(14,18,42,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  color:var(--gold);text-decoration:none;font-size:clamp(14px,2vmin,17px);letter-spacing:.12em;line-height:1.3;transition:background .25s,color .25s}
.fes-link svg{width:1em;height:1em;flex:none}
.fes-link:hover{background:var(--gold);color:var(--night);text-shadow:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ヘッダー：言語切り替え＋ハンバーガー */
.topbar{position:fixed;top:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 0}
.topbar .glass{border:1px solid rgba(222,184,110,.6);background:rgba(14,18,42,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lang{position:relative;display:flex;align-items:center;height:40px;border-radius:0;color:var(--gold)}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--gold);font:13px/1 var(--f-body);letter-spacing:.06em;
  height:100%;padding:0 30px 0 14px;border-radius:0;cursor:pointer}
.lang select option{background:var(--night);color:var(--cream)}
.lang select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.lang svg{position:absolute;right:11px;width:9px;height:6px;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.burger{all:unset;cursor:pointer;position:relative;width:40px;height:40px;border-radius:0;box-sizing:border-box}
.burger span{position:absolute;left:11px;right:11px;height:1.5px;background:var(--gold);transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .2s}
.burger span:nth-child(1){top:13px}.burger span:nth-child(2){top:19px}.burger span:nth-child(3){top:25px}
.menu-open .burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-open .burger span:nth-child(2){opacity:0}
.menu-open .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* ドロワー */
.scrim{position:fixed;inset:0;z-index:25;background:rgba(5,6,18,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:26;width:min(380px,88vw);box-sizing:border-box;overflow-y:auto;
  display:flex;flex-direction:column;gap:28px;visibility:hidden;transform:translateX(100%);
  transition:transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s linear .5s;
  background:linear-gradient(180deg,rgba(14,18,42,.97),rgba(30,25,66,.97));border-left:1px solid rgba(222,184,110,.45);
  padding:calc(88px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 28px}
.menu-open .scrim{opacity:1;pointer-events:auto}
.menu-open .drawer{visibility:visible;transform:none;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.drawer h2{margin:0 0 12px;font-weight:400;font-size:13px;letter-spacing:.3em;color:var(--gold)}
.nav{list-style:none;margin:0;padding:0}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 0;color:var(--cream);text-decoration:none;font-size:22px;letter-spacing:.12em;border-bottom:1px solid rgba(222,184,110,.25)}
.nav a::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.nav a[aria-current="page"]{color:var(--gold)}
.soon{margin:12px 0 0;font-size:13px;letter-spacing:.08em;color:rgba(246,238,222,.6)}
.ext{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;padding:16px 18px;border:4px double var(--gold);color:var(--cream);text-decoration:none;transition:background .25s}
.ext:hover{background:rgba(222,184,110,.12)}
.ext b{font-weight:400;font-size:19px;letter-spacing:.08em}
.ext small{grid-column:1;font-size:13px;color:var(--gold);letter-spacing:.08em}
.ext svg{grid-row:1 / span 2;grid-column:2;width:20px;height:20px;color:var(--gold)}
.drawer-foot{margin-top:auto;font-size:12px;letter-spacing:.12em;color:rgba(246,238,222,.55)}

html[lang="en"] .prep{letter-spacing:.12em;padding-left:.12em}
html[lang="en"] .edition{letter-spacing:.12em}
html[lang="en"] .edition b{padding-left:.12em}
html[lang="en"] .date .box{letter-spacing:.06em}

@media (max-aspect-ratio:3/4){
  .branch{width:clamp(240px,74vw,520px)}
  .title{--c:clamp(84px,26vw,200px)}
  .moon{top:17%;left:10%}
  .pagoda{right:2%;height:clamp(110px,20vh,220px)}
}
@media (prefers-reduced-motion:reduce){
  .branch .bl,.stars .tw,.prep i,.rise{animation:none}
  .drawer,.scrim,.burger span{transition:none}
}
</style>
</head>

  const cubic = (P, t) => {
    const u = 1 - t;
    return [u*u*u*P[0][0] + 3*u*u*t*P[1][0] + 3*u*t*t*P[2][0] + t*t*t*P[3][0],
            u*u*u*P[0][1] + 3*u*u*t*P[1][1] + 3*u*t*t*P[2][1] + t*t*t*P[3][1]];
  };
  // 中心線（3次ベジェ）から先細りの枝の輪郭を作る
  function limb(P, w0, w1) {
    const L = [], R = [], hi = [], N = 48;
    for (let i = 0; i <= N; i++) {
      const t = i / N, a = cubic(P, Math.max(0, t - .01)), b = cubic(P, Math.min(1, t + .01)), p = cubic(P, t);
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const w = (w0 + (w1 - w0) * Math.pow(t, .75)) / 2 * (1 + .06 * Math.sin(t * 23));
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      L.push([p[0] + nx * w, p[1] + ny * w]); R.push([p[0] - nx * w, p[1] - ny * w]);
      hi.push([p[0] + nx * w * .45, p[1] + ny * w * .45]);
    }
    const f = (q) => q.map(v => v[0].toFixed(1) + ' ' + v[1].toFixed(1)).join('L');
    return { body: 'M' + f(L) + 'L' + f(R.reverse()) + 'Z', hi: 'M' + f(hi), at: (t) => {
      const a = cubic(P, Math.max(0, t - .01)), b = cubic(P, Math.min(1, t + .01));
      return { p: cubic(P, t), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI };
    } };
  }
  const main = limb([[700,30],[600,74],[470,166],[232,322]], 30, 5);
  const m = (t) => main.at(t).p;
  const twigs = [
    limb([m(.17),[606,40],[618,18],[640,-6]], 10, 3),
    limb([m(.36),[548,190],[566,228],[570,282]], 11, 2.4),
    limb([m(.55),[392,196],[350,190],[296,198]], 9, 2.2),
    limb([m(.72),[340,272],[330,312],[316,360]], 7.5, 2)
  ];
  const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const defs = svgEl('defs', {});
  defs.innerHTML = '<linearGradient id="bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3a18"/><stop offset=".55" stop-color="#4e2210"/><stop offset="1" stop-color="#2c1208"/></linearGradient>';
  branch.appendChild(defs);
  const back = svgEl('g', {}), woodG = svgEl('g', {}), front = svgEl('g', {});
  branch.append(back, woodG, front);
  for (const lb of [...twigs, main]) {
    woodG.appendChild(svgEl('path', { d: lb.body, fill: 'url(#bark)' }));
    woodG.appendChild(svgEl('path', { d: lb.hi, fill: 'none', stroke: '#b0703a', 'stroke-width': 1.2, 'stroke-linecap': 'round', opacity: .55 }));
  }
  const branchLeaves = [];
  // 葉を1枚付ける：葉柄の根元(bx,by)から外向き角度angへ
  function attach(group, bx, by, ang, s, col) {
    const a = ang * Math.PI / 180, len = 52 * s;
    const cx = bx + Math.cos(a) * len, cy = by + Math.sin(a) * len;
    const g = svgEl('g', { class: 'bl' });
    g.style.transformOrigin = `${bx.toFixed(1)}px ${by.toFixed(1)}px`;
    g.style.setProperty('--a', (1.5 + srand() * 3.5).toFixed(1) + 'deg');
    g.style.animationDuration = (2.2 + srand() * 2.4).toFixed(2) + 's';
    g.style.animationDelay = (-srand() * 4).toFixed(2) + 's';
    g.appendChild(svgEl('use', { href: '#leaf-' + col, x: -110, y: -110, width: 220, height: 220,
      transform: `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${(ang + 74).toFixed(1)}) scale(${s.toFixed(3)})` }));
    group.appendChild(g);
    branchLeaves.push(g);
  }
  const warm = ['orange','orange','orange','scarlet','scarlet','scarlet','red','red','yellow'];
  const deep = ['red','scarlet','scarlet','orange'];
  const pickS = (arr) => arr[Math.floor(srand() * arr.length)];
  // 節ごとに対生、枝先に3枚
  function dress(lb, nodes, sMin, sMax) {
    for (const t of nodes) {
      const { p, ang } = lb.at(t);
      const spread = 58 + srand() * 22, s = sMin + srand() * (sMax - sMin);
      const b1 = srand() < .35, b2 = srand() < .35;
      attach(b1 ? back : front, p[0], p[1], ang - spread - 10, s, pickS(b1 ? deep : warm));
      attach(b2 ? back : front, p[0], p[1], ang + spread + 10, s * (.85 + srand() * .2), pickS(b2 ? deep : warm));
    }
    const { p, ang } = lb.at(1);
    attach(front, p[0], p[1], ang, sMax * 1.05, pickS(['orange','orange','scarlet','yellow']));
    attach(back, p[0], p[1], ang - 44, sMax * .88, pickS(deep));
    attach(back, p[0], p[1], ang + 44, sMax * .88, pickS(deep));
  }
  dress(main, [.32, .5, .66, .84], .62, .82);
  dress(twigs[0], [.5], .55, .7);
  dress(twigs[1], [.5], .6, .78);
  dress(twigs[2], [.5], .58, .74);
  dress(twigs[3], [.55], .52, .68);
  // 奥の葉を少し沈ませる
  back.setAttribute('opacity', '.92');
  back.style.filter = 'brightness(.82)';

  /* ---- 降るモミジ（風と振り子運動のシミュレーション） ---- */
  const fall = document.getElementById('fall');
  const W = () => innerWidth, H = () => innerHeight;
  const COLORS_FALL = COLORS;

  function svgLeaf(color) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '-110 -110 220 220');
    s.appendChild(svgEl('use', { href: '#leaf-' + color }));
    return s;
  }

  if (reduce) {
    const spots = [[.08,.36,-20],[.86,.5,15],[.2,.62,-35],[.62,.3,40],[.42,.48,-10],[.74,.66,25],[.3,.2,60]];
    for (const [px, py, r] of spots) {
      const el = document.createElement('div');
      el.className = 'leaf';
      const s = Math.min(W(), H()) * .07 + 14;
      el.style.cssText = `width:${s}px;height:${s}px;transform:translate(${px * W()}px,${py * H()}px) rotate(${r}deg)`;
      el.appendChild(svgLeaf(pick(COLORS_FALL)));
      fall.appendChild(el);
    }
    return;
  }

  const leaves = [];
  let gust = 0;

  function spawn(L, initial) {
    const w = W(), h = H(), base = Math.min(w, h);
    const bokeh = L.bokeh;
    const depth = bokeh ? 1.5 : Math.random();
    const size = bokeh ? base * .17 + 40 : base * (.035 + depth * .06) + 12;
    L.size = size; L.depth = depth;
    L.el.style.width = L.el.style.height = size.toFixed(0) + 'px';
    const svg = svgLeaf(pick(COLORS_FALL));
    svg.setAttribute('class', bokeh ? 'bokeh' : depth < .3 ? 'far' : '');
    L.el.replaceChildren(svg);

    L.mode = bokeh ? 'glide' : Math.random() < .3 ? 'tumble' : 'glide';
    L.omega = rand(1.0, 1.9) * (L.mode === 'tumble' ? 1.3 : 1);
    L.phase = rand(0, Math.PI * 2);
    L.amp = rand(22, 60) * (.6 + depth);
    L.vy0 = (bokeh ? 150 : 30 + depth * 46) * (h / 900 * .5 + .5);
    L.tilt = rand(22, 42);
    L.rot0 = rand(-35, 35);
    L.spin = rand(0, 360);
    L.spinRate = rand(110, 230) * (Math.random() < .5 ? -1 : 1);
    L.target = bokeh ? .75 : .62 + .38 * depth;
    L.life = 0;

    const fromBranch = !initial && !bokeh && Math.random() < .25 + gust * .45;
    if (fromBranch) {
      const g = branchLeaves[Math.floor(Math.random() * branchLeaves.length)].getBoundingClientRect();
      L.x = g.left + g.width / 2 - size / 2; L.y = g.top + g.height / 2 - size / 2;
      L.fade = .9;
    } else {
      L.x = rand(-.05 * w, 1.3 * w);
      L.y = initial ? rand(-.1 * h, h) : -size * 1.5 - rand(0, h * .25);
      L.fade = 0;
    }
    L.el.style.opacity = L.fade ? 0 : L.target;
  }

  const n = Math.round(Math.min(30, Math.max(12, W() * H() / 50000)));
  const nb = W() > 700 ? 2 : 1;
  for (let i = 0; i < n + nb; i++) {
    const el = document.createElement('div');
    el.className = 'leaf';
    fall.appendChild(el);
    const L = { el, bokeh: i >= n };
    spawn(L, true);
    if (L.bokeh) L.y = -L.size * 2 - rand(0, H() * 1.5);
    leaves.push(L);
  }

  let last = performance.now(), t = rand(0, 100);
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    const w = W(), h = H();
    // ゆっくり強弱する風（左向き）
    const g = (Math.sin(t * .23) + Math.sin(t * .137 + 2) + Math.sin(t * .071 + 4)) / 3;
    gust = Math.max(0, g) ** 1.4;
    const scale = Math.min(1.5, Math.max(.5, w / 1200));
    const wind = -(10 + 70 * gust) * scale;

    for (const L of leaves) {
      L.phase += L.omega * dt;
      const c = Math.cos(L.phase), s = Math.sin(L.phase);
      const resp = 1.3 - .5 * Math.min(L.depth, 1);
      const vx = L.amp * L.omega * c * .9 + wind * resp;
      const vy = L.vy0 * (.45 + .55 * Math.abs(c)) * (L.mode === 'tumble' ? 1.25 : 1);
      L.x += vx * dt; L.y += vy * dt;
      let rz, rx, ry;
      if (L.mode === 'glide') {        // 振り子：揺れる向きに傾き、端で減速
        rz = L.rot0 + L.tilt * c;
        rx = 18 + 32 * Math.abs(s);
        ry = 28 * s;
      } else {                          // くるくる回りながら落ちる
        L.spin += L.spinRate * dt;
        rz = L.rot0 + L.spin * .3;
        rx = L.spin;
        ry = 20 * s;
      }
      L.el.style.transform = `translate3d(${L.x.toFixed(1)}px,${L.y.toFixed(1)}px,0) perspective(500px) rotate(${rz.toFixed(1)}deg) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg)`;
      if (L.fade) {
        L.life += dt;
        const k = Math.min(1, L.life / L.fade);
        L.el.style.opacity = (L.target * k).toFixed(2);
        if (k >= 1) L.fade = 0;
      }
      if (L.y > h + L.size * 2 || L.x < -L.size * 3 || L.x > w * 1.4) spawn(L, false);
    }
    // 枝も風に合わせてしなる
    branch.style.transform = `rotate(${(Math.sin(t * .7) * .45 + gust * 1.8 - .4).toFixed(2)}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  let lang = 'ja';
  try { const v = localStorage.getItem('photostudio-lang'); if (v === 'en' || v === 'ja') lang = v; } catch (e) {}
  const btn = document.getElementById('menu-btn');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const isOpen = () => document.body.classList.contains('menu-open');

  function apply(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[l][el.dataset.i18n]; });
    sel.value = l;
    btn.setAttribute('aria-label', T[l][isOpen() ? 'menuClose' : 'menuOpen']);
    try { localStorage.setItem('photostudio-lang', l); } catch (e) {}
  }
  const sel = document.getElementById('lang-select');
  sel.addEventListener('change', () => apply(sel.value));

  function setMenu(open) {
    document.body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', T[lang][open ? 'menuClose' : 'menuOpen']);
    drawer.inert = !open;
    if (open) setTimeout(() => drawer.querySelector('a').focus(), 60); else btn.focus();
  }
  btn.addEventListener('click', () => setMenu(!isOpen()));
  scrim.addEventListener('click', () => setMenu(false));
  addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) setMenu(false); });
  drawer.querySelector('.nav a').addEventListener('click', e => { e.preventDefault(); setMenu(false); });

  if (lang !== 'ja') apply(lang);
})();
